<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Test 1</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  #container {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
  }

  #scene {
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    perspective: 1200px;
  }

  #world {
    position: absolute;
    transform-style: preserve-3d;
    transition: transform 1s;
  }

  .element {
    position: absolute;
    width: 128px; height: 144px;
    margin: -72px 0 0 -64px;
    border-radius: 6px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.15) inset;
    background: rgba(20, 10, 10, 0.85);
    text-align: center;
    line-height: normal;
    cursor: pointer;
    transition: background-color 0.6s, box-shadow 0.6s, opacity 0.6s,
                transform 1.4s cubic-bezier(0.4, 0.0, 0.2, 1);
    -webkit-user-select: none;
    user-select: none;
  }

  .element .number {
    position: absolute;
    top: 8px; left: 10px;
    font-size: 15px;
    color: rgba(255,255,255,0.55);
  }

  .element .symbol {
    position: absolute;
    top: 30px; left: 0; right: 0;
    font-size: 40px;
    font-weight: bold;
    line-height: 42px;
  }

  .element .details {
    position: absolute;
    bottom: 10px; left: 0; right: 0;
    font-size: 12px;
    letter-spacing: 0.3px;
    color: rgba(255,255,255,0.75);
    padding: 0 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cat-alkali      { color: #ff9a6a; box-shadow: 0 0 0 1px rgba(255,154,106,0.5) inset, 0 0 18px -4px rgba(255,120,60,0.8); }
  .cat-alkaline    { color: #ffd27a; box-shadow: 0 0 0 1px rgba(255,210,122,0.5) inset, 0 0 18px -4px rgba(255,190,90,0.8); }
  .cat-transition  { color: #9adfff; box-shadow: 0 0 0 1px rgba(154,223,255,0.5) inset, 0 0 18px -4px rgba(90,190,255,0.8); }
  .cat-posttrans   { color: #b6f2c2; box-shadow: 0 0 0 1px rgba(182,242,194,0.5) inset, 0 0 18px -4px rgba(120,220,150,0.8); }
  .cat-metalloid   { color: #d9e27a; box-shadow: 0 0 0 1px rgba(217,226,122,0.5) inset, 0 0 18px -4px rgba(200,215,70,0.8); }
  .cat-nonmetal    { color: #b6ffb0; box-shadow: 0 0 0 1px rgba(182,255,176,0.5) inset, 0 0 18px -4px rgba(120,255,110,0.8); }
  .cat-halogen     { color: #ff8a8a; box-shadow: 0 0 0 1px rgba(255,138,138,0.5) inset, 0 0 18px -4px rgba(255,90,90,0.9); }
  .cat-noble       { color: #c9a6ff; box-shadow: 0 0 0 1px rgba(201,166,255,0.5) inset, 0 0 18px -4px rgba(170,120,255,0.85); }
  .cat-lanthanide  { color: #ffb0e0; box-shadow: 0 0 0 1px rgba(255,176,224,0.5) inset, 0 0 18px -4px rgba(255,120,200,0.8); }
  .cat-actinide    { color: #ffc98a; box-shadow: 0 0 0 1px rgba(255,201,138,0.5) inset, 0 0 18px -4px rgba(255,170,90,0.8); }
  .cat-unknown     { color: #cfcfcf; box-shadow: 0 0 0 1px rgba(207,207,207,0.4) inset, 0 0 14px -4px rgba(200,200,200,0.6); }

  .element:hover {
    box-shadow: 0 0 0 1.5px rgba(255,255,255,0.9) inset, 0 0 26px -2px rgba(255,255,255,0.9);
    z-index: 10;
  }

  .element.selected {
    box-shadow: 0 0 0 2px #fff inset, 0 0 34px -2px rgba(255,255,255,1);
    z-index: 11;
  }



  #menu {
    position: absolute;
    top: 18px; left: 0; right: 0;
    text-align: center;
    z-index: 100;
  }

  #menu button {
    background: rgba(15,15,15,0.85);
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.55);
    font-size: 12px;
    letter-spacing: 1.5px;
    padding: 8px 18px;
    margin: 0 3px;
    cursor: pointer;
    border-radius: 3px;
    text-transform: lowercase;
    transition: all 0.25s;
  }

  #menu button:hover {
    color: rgba(255,255,255,0.9);
    border-color: rgba(255,255,255,0.4);
  }

  #menu button.active {
    background: rgba(240,240,240,0.92);
    color: #111;
    border-color: rgba(255,255,255,0.9);
  }

  #hint {
    position: absolute;
    bottom: 14px; left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.28);
    font-size: 11px;
    letter-spacing: 0.5px;
    z-index: 100;
    pointer-events: none;
  }

  #container { cursor: default; }

  #meaning-tip {
    position: fixed;
    z-index: 200;
    max-width: 220px;
    background: rgba(10,10,10,0.95);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 5px;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.4;
    color: rgba(255,255,255,0.9);
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.15s, transform 0.15s;
  }

  #meaning-tip.visible {
    opacity: 1;
    transform: translateY(0);
  }

  #meaning-tip .tip-title {
    font-weight: bold;
    margin-bottom: 3px;
    color: #fff;
  }

  #card-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    z-index: 250;
  }

  #card-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  #info-panel {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 300;
    width: 260px;
    background: rgba(8,8,8,0.96);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 8px;
    padding: 16px 18px;
    color: rgba(255,255,255,0.9);
    opacity: 0;
    pointer-events: none;
    transform: translateY(12px);
    transition: opacity 0.25s, transform 0.25s;
    box-shadow: 0 8px 40px -8px rgba(0,0,0,0.8);
    transform-origin: center center;
  }

  #info-panel.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  #info-panel .panel-close {
    position: absolute;
    top: 8px; right: 10px;
    cursor: pointer;
    color: rgba(255,255,255,0.5);
    font-size: 16px;
    line-height: 1;
    transition: color 0.2s;
  }

  #info-panel .panel-close:hover {
    color: rgba(255,255,255,0.95);
  }

  #info-panel .panel-number {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.5px;
  }

  #info-panel .panel-symbol {
    font-size: 40px;
    font-weight: bold;
    line-height: 1.1;
    margin: 2px 0 4px;
  }

  #info-panel .panel-name {
    font-size: 15px;
    margin-bottom: 2px;
  }

  #info-panel .panel-category {
    font-size: 11px;
    text-transform: capitalize;
    color: rgba(255,255,255,0.55);
    margin-bottom: 10px;
    letter-spacing: 0.3px;
  }

  #info-panel .panel-meaning {
    font-size: 12.5px;
    line-height: 1.5;
    color: rgba(255,255,255,0.85);
  }

  #info-panel .panel-extra {
    font-size: 12.5px;
    line-height: 1.5;
    color: rgba(255,255,255,0.65);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.12);
  }

</style>

  var CELL = 144;

  var world = document.getElementById('world');
  var objects = [];
  var selectedObj = null;

  ELEMENTS.forEach(function (e) {
    var num = e[0], sym = e[1], name = e[2], cat = e[3], row = e[4], col = e[5];

    var div = document.createElement('div');
    div.className = 'element cat-' + cat;

    var elNum = document.createElement('div');
    elNum.className = 'number';
    elNum.textContent = num;

    var elSym = document.createElement('div');
    elSym.className = 'symbol';
    elSym.textContent = sym;

    var elDet = document.createElement('div');
    elDet.className = 'details';
    elDet.textContent = name;

    div.appendChild(elNum);
    div.appendChild(elSym);
    div.appendChild(elDet);
    world.appendChild(div);

    var tableRow = row <= 7 ? row : (row === 9 ? 8.5 : 9.5);
    var tx = (col - 1) * CELL - 9 * CELL;
    var ty = (tableRow - 1) * CELL - 4 * CELL;

    var obj = {
      el: div,
      num: num,
      sym: sym,
      name: name,
      cat: cat,
      table: { x: tx, y: ty, z: 0, rx: 0, ry: 0 }
    };

    div.addEventListener('mouseenter', function (ev) {
      showMeaningTip(name, MEANINGS[num], ev.clientX, ev.clientY);
    });
    div.addEventListener('mousemove', function (ev) {
      positionMeaningTip(ev.clientX, ev.clientY);
    });
    div.addEventListener('mouseleave', function () {
      hideMeaningTip();
    });
    div.addEventListener('click', function (ev) {
      ev.stopPropagation();
      pulseElement(obj);
      selectElement(obj);
    });

    objects.push(obj);
  });

  var meaningTip = document.getElementById('meaning-tip');

  function showMeaningTip(name, text, x, y) {
    if (!text) return;
    meaningTip.innerHTML = '<div class="tip-title">' + name + '</div>' + text;
    meaningTip.classList.add('visible');
    positionMeaningTip(x, y);
  }

  function positionMeaningTip(x, y) {
    var offset = 16;
    var tipWidth = meaningTip.offsetWidth || 220;
    var left = x + offset;
    if (left + tipWidth > window.innerWidth) {
      left = x - offset - tipWidth;
    }
    meaningTip.style.left = left + 'px';
    meaningTip.style.top = (y + offset) + 'px';
  }

  function hideMeaningTip() {
    meaningTip.classList.remove('visible');
  }

  var cardOverlay = document.getElementById('card-overlay');
  cardOverlay.addEventListener('click', function () {
    deselectElement();
  });

  var infoPanel = document.getElementById('info-panel');
  var panelNumber = infoPanel.querySelector('.panel-number');
  var panelSymbol = infoPanel.querySelector('.panel-symbol');
  var panelName = infoPanel.querySelector('.panel-name');
  var panelCategory = infoPanel.querySelector('.panel-category');
  var panelMeaning = infoPanel.querySelector('.panel-meaning');
  var panelExtra = infoPanel.querySelector('.panel-extra');
  var panelClose = infoPanel.querySelector('.panel-close');
  var infoPanelCurrentCat = null;

  var CARD_W = 300;
  var CARD_H = 380;

  function flyCardIn(rect, cat) {
    if (infoPanelCurrentCat) {
      infoPanel.classList.remove('cat-' + infoPanelCurrentCat);
    }
    infoPanel.classList.add('cat-' + cat);
    infoPanelCurrentCat = cat;

    infoPanel.classList.add('visible');

    infoPanel.style.transition = 'none';
    infoPanel.style.left = '50%';
    infoPanel.style.top = '50%';
    infoPanel.style.right = 'auto';
    infoPanel.style.bottom = 'auto';
    infoPanel.style.width = CARD_W + 'px';
    infoPanel.style.height = CARD_H + 'px';
    infoPanel.style.marginLeft = (-CARD_W / 2) + 'px';
    infoPanel.style.marginTop = (-CARD_H / 2) + 'px';

    var scaleX = rect.width / CARD_W;
    var scaleY = rect.height / CARD_H;
    var dx = (rect.left + rect.width / 2) - window.innerWidth / 2;
    var dy = (rect.top + rect.height / 2) - window.innerHeight / 2;

    infoPanel.style.opacity = '0';
    infoPanel.style.transform =
      'translate(' + dx + 'px,' + dy + 'px) scale(' + scaleX + ',' + scaleY + ')';

    void infoPanel.offsetWidth;

    infoPanel.style.transition =
      'transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease-out';
    infoPanel.style.opacity = '1';
    infoPanel.style.transform = 'translate(0px,0px) scale(1,1)';
  }

  function flyCardOut() {
    infoPanel.style.transition = 'transform 0.3s ease-in, opacity 0.3s ease-in';
    infoPanel.style.opacity = '0';
    infoPanel.style.transform = 'translate(0px,0px) scale(0.85,0.85)';

    setTimeout(function () {
      infoPanel.classList.remove('visible');
      infoPanel.style.transition = '';
      infoPanel.style.transform = '';
      infoPanel.style.opacity = '';
      infoPanel.style.left = '';
      infoPanel.style.top = '';
      infoPanel.style.right = '';
      infoPanel.style.bottom = '';
      infoPanel.style.width = '';
      infoPanel.style.height = '';
      infoPanel.style.marginLeft = '';
      infoPanel.style.marginTop = '';
      if (infoPanelCurrentCat) {
        infoPanel.classList.remove('cat-' + infoPanelCurrentCat);
        infoPanelCurrentCat = null;
      }
    }, 300);
  }

  function selectElement(obj) {
    if (selectedObj === obj) {
      deselectElement();
      return;
    }
    if (selectedObj) {
      selectedObj.el.classList.remove('selected');
    }
    selectedObj = obj;
    obj.el.classList.add('selected');

    panelNumber.textContent = 'Element ' + obj.num;
    panelSymbol.textContent = obj.sym;
    panelName.textContent = obj.name;
    panelCategory.textContent = obj.cat.replace(/([a-z])([A-Z])/g, '$1 $2');
    panelMeaning.textContent = MEANINGS[obj.num] || '';
    panelExtra.textContent = EXTRA_INFO[obj.num] || '';

    var rect = obj.el.getBoundingClientRect();
    flyCardIn(rect, obj.cat);
    cardOverlay.classList.add('visible');
  }

  function deselectElement() {
    if (selectedObj) {
      selectedObj.el.classList.remove('selected');
      selectedObj = null;
    }
    flyCardOut();
    cardOverlay.classList.remove('visible');
  }

  panelClose.addEventListener('click', function (ev) {
    ev.stopPropagation();
    deselectElement();
  });

  var vector = { x: 0, y: 0, z: 0 };

  (function () {
    var n = objects.length;
    for (var i = 0; i < n; i++) {
      var phi = Math.acos(-1 + (2 * i) / n);
      var theta = Math.sqrt(n * Math.PI) * phi;
      var radius = 900;

      var x = radius * Math.cos(theta) * Math.sin(phi);
      var y = radius * Math.sin(theta) * Math.sin(phi);
      var z = radius * Math.cos(phi);

      var obj = objects[i];
      obj.sphere = { x: x, y: y, z: z };

      var rad2deg = 180 / Math.PI;
      var ry = -Math.atan2(-z, x) * rad2deg + 90;
      var rx = Math.atan2(Math.sqrt(x * x + z * z), y) * rad2deg - 90;
      obj.sphere.rx = rx;
      obj.sphere.ry = ry;
    }
  })();

  (function () {
    var n = objects.length;
    for (var i = 0; i < n; i++) {
      var theta = i * 0.175;
      var y = -(i * 8) + 450;
      var radius = 900;

      var x = radius * Math.sin(theta);
      var z = radius * Math.cos(theta);

      var obj = objects[i];
      var ry = -theta * 180 / Math.PI + 90;
      obj.helix = { x: x, y: y, z: z, rx: 0, ry: ry };
    }
  })();

  (function () {
    var n = objects.length;
    var cols = 12;
    for (var i = 0; i < n; i++) {
      var col = i % cols;
      var row = Math.floor(i / cols);
      var x = col * CELL - (cols - 1) * CELL / 2;
      var y = row * CELL - 4.5 * CELL;
      var z = 0;
      objects[i].grid = { x: x, y: y, z: z, rx: 0, ry: 0 };
    }
  })();

  function applyTarget(name) {
    objects.forEach(function (obj, i) {
      var t = obj[name];
      setTimeout(function () {
        var s = 'translate3d(' + t.x + 'px,' + t.y + 'px,' + t.z + 'px) '
          + 'rotateX(' + (t.rx || 0) + 'deg) rotateY(' + (t.ry || 0) + 'deg)';
        obj.baseTransform = s;
        obj.el.style.transform = s;
      }, i * 6);
    });
  }

  var PULSE_KEYFRAMES = [
    { t: 0,    s: 1 },
    { t: 0.35, s: 1.28 },
    { t: 0.6,  s: 0.94 },
    { t: 1,    s: 1 }
  ];

  function pulseScaleAt(progress) {
    for (var i = 1; i < PULSE_KEYFRAMES.length; i++) {
      var a = PULSE_KEYFRAMES[i - 1], b = PULSE_KEYFRAMES[i];
      if (progress <= b.t) {
        var localT = (progress - a.t) / (b.t - a.t || 1);
        return a.s + (b.s - a.s) * localT;
      }
    }
    return 1;
  }

  var PULSE_TRANSITION = 'background-color 0.6s, box-shadow 0.6s, opacity 0.6s';

  function pulseElement(obj) {
    var duration = 420;
    var start = null;
    obj.el.style.transition = PULSE_TRANSITION;

    function step(ts) {
      if (start === null) start = ts;
      var progress = Math.min((ts - start) / duration, 1);
      var scale = pulseScaleAt(progress);
      obj.el.style.transform = (obj.baseTransform || '') + ' scale(' + scale + ')';
      if (progress < 1) {
        requestAnimationFrame(step);
      } else {
        obj.el.style.transition = '';
      }
    }
    requestAnimationFrame(step);
  }

  var world_rx = -12, world_ry = 12;
  var target_rx = world_rx, target_ry = world_ry;
  var world_zoom = -1800;

  var MAX_TILT = 35;
  var isDragging = false;
  var lastX = 0, lastY = 0;

  function updateWorldTransform() {
    world.style.transform =
      'translateZ(' + world_zoom + 'px) rotateX(' + world_rx + 'deg) rotateY(' + world_ry + 'deg)';
  }

  function animate() {
    world_rx += (target_rx - world_rx) * 0.09;
    world_ry += (target_ry - world_ry) * 0.09;
    updateWorldTransform();
    requestAnimationFrame(animate);
  }
  animate();

  var container = document.getElementById('container');

  function setTiltFromPoint(clientX, clientY) {
    var nx = (clientX / window.innerWidth) * 2 - 1;
    var ny = (clientY / window.innerHeight) * 2 - 1;
    target_ry = 12 + nx * MAX_TILT;
    target_rx = -12 - ny * MAX_TILT;
  }

  function updateCursorStyle() {
    container.style.cursor = isDragging ? 'grabbing' : 'grab';
  }

  container.addEventListener('mousedown', function (e) {
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    updateCursorStyle();
  });

  container.addEventListener('click', function (e) {
    if (e.target === container || e.target.id === 'scene' || e.target.id === 'world') {
      deselectElement();
    }
  });

  window.addEventListener('mouseup', function () {
    isDragging = false;
    updateCursorStyle();
  });

  window.addEventListener('mousemove', function (e) {
    if (isDragging) {
      var dx = e.clientX - lastX;
      var dy = e.clientY - lastY;
      target_ry += dx * 0.35;
      target_rx -= dy * 0.35;
      lastX = e.clientX;
      lastY = e.clientY;
    } else {
      setTiltFromPoint(e.clientX, e.clientY);
    }
  });

  container.addEventListener('touchstart', function (e) {
    if (!e.touches.length) return;
    isDragging = true;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  }, { passive: true });

  window.addEventListener('touchend', function () { isDragging = false; });

  window.addEventListener('touchmove', function (e) {
    if (!e.touches || !e.touches.length) return;
    if (isDragging) {
      var dx = e.touches[0].clientX - lastX;
      var dy = e.touches[0].clientY - lastY;
      target_ry += dx * 0.35;
      target_rx -= dy * 0.35;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    } else {
      setTiltFromPoint(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });

  updateWorldTransform();
  updateCursorStyle();

  var buttons = document.querySelectorAll('#menu button');

  var DEFAULT_ANGLES = {
    table:  { rx: -12, ry: 12 },
    sphere: { rx: -12, ry: 12 },
    helix:  { rx: -78, ry: 8 },
    grid:   { rx: -12, ry: 12 }
  };

  function setMode(mode) {
    buttons.forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-mode') === mode);
    });
    isDragging = false;
    updateCursorStyle();
    var a = DEFAULT_ANGLES[mode];
    if (a) { target_rx = a.rx; target_ry = a.ry; }
    applyTarget(mode);
  }
  buttons.forEach(function (b) {
    b.addEventListener('click', function () {
      setMode(b.getAttribute('data-mode'));
    });
  });

  setMode('sphere');
})();
